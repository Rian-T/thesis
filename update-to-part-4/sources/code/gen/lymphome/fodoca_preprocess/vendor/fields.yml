- category: Démographie
  subfields:
  - field_type: date
    label: Mois et année de naissance
    name: demography_birth_date
  - field_type: select
    label: Sexe
    name: demography_sexe
    valid_values:
    - homme
    - femme
  - field_type: select
    label: Statut marital
    name: demography_marital_status
    valid_values:
    - marié
    - en vie avec un partenaire
    - célibataire
    - divorcé
    - veuf
  - field_type: select
    label: Habitat
    name: demography_living_environment
    valid_values:
    - rural
    - urbain
    - semi-urbain
  - field_type: openlist
    label: Situation professionnelle
    name: demography_professional_status
    valid_values:
    - actif
    - retraité
    - etudiant
    - sans statut professionnel
    - invalidité
  - field_type: text
    label: Categorie professionnelle
    name: demography_professional_category
- category: Histoire de la maladie
